
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ふたりのお財布</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #fafafa;
  color: #222;
  font-family: -apple-system, BlinkMacSystemFont,
    "Helvetica Neue", sans-serif;
}
main {
  max-width: 480px;
  margin: auto;
  padding: 28px 20px 60px;
}
h1 { font-size: 23px; margin: 0 0 28px; }
h2 { font-size: 15px; margin: 30px 0 14px; }
.card, .history {
  background: white;
  border: 1px solid #eee;
  border-radius: 16px;
  padding: 20px;
}
.label { color: #888; font-size: 13px; }
.amount {
  font-size: 34px;
  font-weight: 650;
  margin: 8px 0;
}
.details { color: #888; font-size: 13px; }
input, select {
  width: 100%;
  padding: 14px;
  border: 1px solid #e5e5e5;
  border-radius: 10px;
  background: white;
  font-size: 16px;
  margin-bottom: 10px;
}
button {
  border: none;
  border-radius: 10px;
  padding: 14px;
  background: #222;
  color: white;
  font-size: 14px;
  font-weight: 600;
}
button:disabled { opacity: .5; }
.full { width: 100%; }
.secondary {
  background: #f0f0f0;
  color: #222;
}
.row {
  display: flex;
  gap: 10px;
}
.row > * { flex: 1; min-width: 0; }
.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 15px 0;
  border-bottom: 1px solid #eee;
}
.item:last-child { border-bottom: none; }
.item-name { font-size: 14px; font-weight: 600; }
.date { color: #999; font-size: 12px; margin-top: 5px; }
.item-price { font-size: 14px; white-space: nowrap; }
.small { font-size: 12px; padding: 8px 10px; }
.hidden { display: none; }


/* iPhoneの日付・月選択欄の幅を統一 */
input[type="date"],
input[type="month"] {
  display: block;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  -webkit-appearance: none;
  appearance: none;
}

/* 入力欄の内側もはみ出さないように */
input::-webkit-date-and-time-value {
  min-width: 0;
  text-align: center;
}

</style>
</head>
<body>
<main>
  <h1>ふたりのお財布</h1>

  <input type="month" id="month">

  <div class="card">
    <div class="label">今月の残り予算</div>
    <div class="amount" id="balance">—</div>
    <div class="details" id="summary">読み込み中...</div>
    <button class="secondary small" id="budgetEdit"
      style="margin-top:14px">予算を変更</button>
  </div>

  <section id="budgetPanel" class="hidden">
    <h2>月の予算を変更</h2>
    <input id="budgetAmount" type="number"
      min="0" max="10000000" placeholder="予算">
    <button class="full" id="budgetSave">保存する</button>
  </section>

<section id="defaultBudgetSection" class="hidden">
  <button class="secondary small" id="defaultBudgetEdit"
    type="button">デフォルト予算を変更</button>

  <div id="defaultBudgetPanel" class="hidden"
    style="margin-top:14px">
    <div class="label" style="margin-bottom:8px">
      新しい月に自動適用する予算
    </div>
    <input id="defaultBudgetAmount" type="number"
      min="0" max="10000000"
      placeholder="デフォルト予算">
    <button class="full" id="defaultBudgetSave"
      type="button">デフォルト予算を保存</button>
  </div>
</section>

  <h2 id="formTitle">支出・入金を追加</h2>
  <form id="form">
    <select id="type">
      <option value="expense">支出</option>
      <option value="income">入金</option>
    </select>
    <input id="name" placeholder="お店・用途" required
      maxlength="100">
    <input id="price" type="number" min="1"
      max="10000000" placeholder="金額" required>
    <input id="spent_on" type="date" required>
    <div class="row">
      <button type="submit" id="saveButton">登録する</button>
      <button type="button" class="secondary hidden"
        id="cancelEdit">キャンセル</button>
    </div>
  </form>

  <h2>利用履歴</h2>
  <div class="history" id="history">読み込み中...</div>
</main>

<script>
const yen = n => n.toLocaleString("ja-JP") + "円";
const $ = id => document.getElementById(id);

const today = () => {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const get = type =>
    parts.find(p => p.type === type).value;

  return `${get("year")}-${get("month")}-${get("day")}`;
};

let history = [];
let budget = 40000;
let editingId = null;

$("month").value = today().slice(0, 7);
$("spent_on").value = today();

async function request(url, options) {
  const response = await fetch(url, {
    cache: "no-store",
    ...options
  });

  if (!response.ok) {
    throw new Error("通信に失敗しました");
  }

  return response.json();
}

async function load() {
  const month = $("month").value;

  try {
    const [transactions, budgetData] =
      await Promise.all([
        request("/api/transactions"),
        request("/api/budget?month=" +
          encodeURIComponent(month))
      ]);

    history = transactions;
    budget = budgetData.amount;
    render();
  } catch (e) {
    alert("データを取得できませんでした");
  }
}

function render() {
  const month = $("month").value;
  const monthly = history.filter(x =>
    x.spent_on.startsWith(month)
  );

  const spent = monthly
    .filter(x => x.type === "expense")
    .reduce((s, x) => s + x.price, 0);

  const income = monthly
    .filter(x => x.type === "income")
    .reduce((s, x) => s + x.price, 0);

  $("balance").textContent = yen(budget - spent);
  $("summary").textContent =
    `予算 ${yen(budget)} ・ 支出 ${yen(spent)} ・ 入金 ${yen(income)}`;

  const list = $("history");
  list.replaceChildren();

  if (!monthly.length) {
    list.textContent = "この月の履歴はありません";
    return;
  }

  monthly.forEach(x => {
    const item = document.createElement("div");
    item.className = "item";

    const left = document.createElement("div");
    const name = document.createElement("div");
    name.className = "item-name";
    name.textContent = x.name;

    const date = document.createElement("div");
    date.className = "date";
    date.textContent = x.spent_on;

    left.append(name, date);

    const right = document.createElement("div");
    const price = document.createElement("div");
    price.className = "item-price";
    price.textContent =
      (x.type === "income" ? "＋" : "−") +
      yen(x.price);

    const edit = document.createElement("button");
    edit.className = "secondary small";
    edit.textContent = "編集";
    edit.onclick = () => startEdit(x);

    const del = document.createElement("button");
    del.className = "secondary small";
    del.textContent = "削除";
    del.onclick = () => removeItem(x);

    right.append(price, edit, del);
    item.append(left, right);
    list.append(item);
  });
}

function startEdit(x) {
  editingId = x.id;
  $("type").value = x.type;
  $("name").value = x.name;
  $("price").value = x.price;
  $("spent_on").value = x.spent_on;
  $("formTitle").textContent = "履歴を編集";
  $("saveButton").textContent = "変更を保存";
  $("cancelEdit").classList.remove("hidden");
  $("form").scrollIntoView({ behavior: "smooth" });
}

function resetForm() {
  editingId = null;
  $("form").reset();
  $("spent_on").value = today();
  $("formTitle").textContent = "支出・入金を追加";
  $("saveButton").textContent = "登録する";
  $("cancelEdit").classList.add("hidden");
}

$("cancelEdit").onclick = resetForm;

$("form").onsubmit = async e => {
  e.preventDefault();

  const payload = {
    name: $("name").value.trim(),
    price: Number($("price").value),
    type: $("type").value,
    spent_on: $("spent_on").value
  };

  const method = editingId ? "PATCH" : "POST";

  if (editingId) payload.id = editingId;

  $("saveButton").disabled = true;

  try {
    await request("/api/transactions", {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    resetForm();
    await load();
  } catch (e) {
    alert("保存できませんでした");
  } finally {
    $("saveButton").disabled = false;
  }
};

async function removeItem(x) {
  if (!confirm(`「${x.name}」を削除しますか？`)) return;

  try {
    await request("/api/transactions", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: x.id })
    });

    await load();
  } catch (e) {
    alert("削除できませんでした");
  }
}

$("budgetEdit").onclick = () => {
  $("budgetAmount").value = budget;
  $("budgetPanel").classList.toggle("hidden");
};

$("budgetSave").onclick = async () => {
  const amount = Number($("budgetAmount").value);

  if (!Number.isSafeInteger(amount) ||
      amount < 0 || amount > 10000000) {
    alert("正しい予算を入力してください");
    return;
  }

  $("budgetSave").disabled = true;

  try {
    await request("/api/budget", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        month: $("month").value,
        amount
      })
    });

    $("budgetPanel").classList.add("hidden");
    await load();
  } catch (e) {
    alert("予算を保存できませんでした");
  } finally {
    $("budgetSave").disabled = false;
  }
};

$("month").onchange = () => {
  resetForm();
  $("budgetPanel").classList.add("hidden");
  load();
};

load();

$("defaultBudgetEdit").onclick = async () => {
  try {
    const data = await request("/api/budget?mode=default");

    $("defaultBudgetAmount").value = data.amount;
    $("defaultBudgetPanel").classList.toggle("hidden");
  } catch {
    alert("デフォルト予算を取得できませんでした");
  }
};

$("defaultBudgetSave").onclick = async () => {
  const input = $("defaultBudgetAmount");

  if (input.value.trim() === "") {
    alert("予算を入力してください");
    return;
  }

  const amount = Number(input.value);

  if (!Number.isSafeInteger(amount) ||
      amount < 0 || amount > 10000000) {
    alert("正しい予算を入力してください");
    return;
  }

  $("defaultBudgetSave").disabled = true;

  try {
    await request("/api/budget", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode: "default",
        amount
      })
    });

    $("defaultBudgetPanel").classList.add("hidden");
    await load();
    alert("デフォルト予算を変更しました");
  } catch {
    alert("保存できませんでした");
  } finally {
    $("defaultBudgetSave").disabled = false;
  }
};

</script>
</body>
</html>
